<!DOCTYPE html>
<html>
<head>
    <title>Brain Stroke Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .icon {
            text-align: center;
            font-size: 40px;
        }

        input:focus, select:focus {
            border-color: #2575fc;
            box-shadow: 0 0 5px rgba(37,117,252,0.5);
        }

        .tooltip {
            font-size: 12px;
            color: gray;
            margin-top: -10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">🧠</div>
    <h1>Stroke Risk Detection</h1>

    <p class="subtitle">AI-powered health risk prediction system</p>

    <form method="POST" onsubmit="this.querySelector('button').innerText='Analyzing...';">

        <!-- Name -->
        <input type="text" name="name" placeholder="Full Name" required>

        <!-- Age -->
        <input type="number" name="age" placeholder="Age" required>

        <!-- Hypertension -->
        <label>Hypertension</label>
        <select name="hypertension">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>
        <div class="tooltip">High blood pressure condition</div>

        <!-- Heart Disease -->
        <label>Heart Disease</label>
        <select name="heart_disease">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>
        <div class="tooltip">History of heart-related issues</div>

        <!-- Glucose -->
        <input type="number" step="0.1" name="glucose" placeholder="Glucose Level" min="50" max="300" required>
        <div class="tooltip">Normal: 70 - 140 mg/dL</div>

        <!-- BMI -->
        <input type="number" step="0.1" name="bmi" placeholder="BMI" min="10" max="50" required>
        <div class="tooltip">Normal: 18.5 - 24.9</div>

        <!-- Button -->
        <button type="submit">🚀 Predict Risk</button>

    </form>

</div>

</body>
</html>
