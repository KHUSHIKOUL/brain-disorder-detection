<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container result-box">

    <h1>🧠 Prediction Result</h1>

    <p><b>Name:</b> {{ name }}</p>
    <p><b>Age:</b> {{ age }}</p>

    <h2 class="{{ risk | lower }}">
        Risk Level: {{ risk }}
    </h2>

    <p><b>Confidence:</b> {{ confidence }}%</p>

    <!-- Progress Bar -->
    <div style="background:#eee; border-radius:10px;">
        <div style="width: {{ confidence }}%; background:red; height:20px; border-radius:10px;"></div>
    </div>

    <br>
    <p><b>Model Accuracy:</b> 95.48%</p>

    <br>
    <a href="/">⬅ Back</a>

</div>

</body>
</html>
